<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 980" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lb2-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1524"/>
      <stop offset="55%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#03040a"/>
    </linearGradient>
    <radialGradient id="lb2-glow" cx="50%" cy="34%" r="55%">
      <stop offset="0%" stop-color="#f0c96a" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#f0c96a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lb2-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2c1c"/>
      <stop offset="100%" stop-color="#1c140c"/>
    </linearGradient>
    <linearGradient id="lb2-ship" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3a4d"/>
      <stop offset="100%" stop-color="#0c1420"/>
    </linearGradient>
    <radialGradient id="lb2-vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".65"/>
    </radialGradient>
  </defs>

  <rect width="700" height="980" fill="url(#lb2-bg)"/>
  <circle cx="350" cy="330" r="320" fill="url(#lb2-glow)"/>

  <!-- Sterne -->
  <g fill="#ffffff" opacity=".55">
    <circle cx="80" cy="90" r="1.6"/><circle cx="140" cy="180" r="1.2"/>
    <circle cx="600" cy="120" r="1.6"/><circle cx="540" cy="70" r="1.2"/>
    <circle cx="250" cy="60" r="1.3"/><circle cx="470" cy="220" r="1.4"/>
    <circle cx="620" cy="260" r="1.1"/><circle cx="60" cy="260" r="1.4"/>
  </g>

  <!-- Kompassrose -->
  <g transform="translate(350,300)" stroke="#f0c96a" stroke-width="1.4" fill="none" opacity=".8">
    <circle r="120"/>
    <circle r="86"/>
    <line x1="0" y1="-135" x2="0" y2="135"/>
    <line x1="-135" y1="0" x2="135" y2="0"/>
    <line x1="-95" y1="-95" x2="95" y2="95"/>
    <line x1="-95" y1="95" x2="95" y2="-95"/>
  </g>
  <path d="M350,178 L364,300 L350,290 L336,300 Z" fill="#f0c96a" opacity=".9"/>

  <!-- verblasste Route/gestrichelte Linie, die im Nebel verschwindet -->
  <path d="M110,470 Q220,430 300,480 T470,470 Q560,460 610,540" fill="none" stroke="#f0c96a" stroke-width="2.5" stroke-dasharray="3 14" opacity=".55"/>
  <circle cx="110" cy="470" r="5" fill="#f0c96a"/>
  <circle cx="610" cy="540" r="5" fill="#ff6a2a" opacity=".7"/>

  <!-- kleines Schiff -->
  <g transform="translate(500,560) scale(1.3)">
    <ellipse cx="0" cy="30" rx="46" ry="5" fill="#4da3ff" opacity=".15"/>
    <path d="M-40,10 Q-42,26 -20,29 L20,29 Q42,26 40,10 Q20,17 0,17 Q-20,17 -40,10 Z" fill="url(#lb2-ship)" stroke="#4da3ff" stroke-opacity=".3"/>
    <line x1="0" y1="-30" x2="0" y2="17" stroke="#5a4a34" stroke-width="2"/>
    <path d="M0,-26 C18,-22 20,-4 17,10 C10,4 4,2 0,2 Z" fill="#c9bfa4"/>
    <path d="M0,-26 C-18,-22 -20,-4 -17,10 C-10,4 -4,2 0,2 Z" fill="#b9ad8f"/>
  </g>

  <!-- Ecken: verbrannter/vergilbter Rand -->
  <rect x="0" y="0" width="700" height="980" fill="url(#lb2-vignette)"/>
  <g fill="url(#lb2-paper)" opacity=".9">
    <path d="M0,0 L120,0 Q40,30 30,110 Q10,60 0,50 Z"/>
    <path d="M700,0 L580,0 Q660,30 670,110 Q690,60 700,50 Z"/>
    <path d="M0,980 L120,980 Q40,950 30,870 Q10,920 0,930 Z"/>
    <path d="M700,980 L580,980 Q660,950 670,870 Q690,920 700,930 Z"/>
  </g>

  <!-- Titel -->
  <text x="350" y="760" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="10" fill="#8296ad">LOGBUCH II</text>
  <text x="350" y="822" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="bold" letter-spacing="2" fill="#f0c96a" style="filter:drop-shadow(0 0 18px rgba(240,201,106,.5))">Die verlorene</text>
  <text x="350" y="884" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="bold" letter-spacing="2" fill="#f0c96a" style="filter:drop-shadow(0 0 18px rgba(240,201,106,.5))">Route</text>

  <!-- Siegel-Stempel -->
  <g transform="translate(560,880) rotate(-14)" opacity=".8">
    <circle r="34" fill="none" stroke="#c8392a" stroke-width="2.5"/>
    <circle r="26" fill="none" stroke="#c8392a" stroke-width="1"/>
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c8392a">FLITZPIEPEN</text>
  </g>
</svg>

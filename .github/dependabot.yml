# Dependabot: woechentliche Versions-PRs.
# npm betrifft nur Werkzeuge der Entwicklung (shadcn) und die
# Versionsangaben in package.json - die Seite selbst laedt gsap, three
# und motion per CDN. Ein Update hier aendert also nichts, was
# Besucher bekommen, bis die CDN-Adresse in index.html mitgezogen wird.
# three steht bewusst fest auf 0.160.0 und wird deshalb ausgenommen.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "three"
    groups:
      entwicklung:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
